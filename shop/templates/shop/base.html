<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body >
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark col-10 offset-1 ">
    <div class="container-fluid">
        <a class="navbar-brand" style="color: white" href="{% url 'shop:listitem' %}">BUYMI</a>
        <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item d-flex">
            <a class="nav-link active" style="color: white" aria-current="page" href="{% url 'shop:contactus' %}">Contact Us</a>
            <a class="nav-link active ms-3" style="color: white" aria-current="page" href="{% url 'shop:view_cart' %}">Cart<span class="fw-bold"> &#123;{{ total }}&#125; </span> </a>
            </li>
        </ul>
        <form method="GET" class="mx-auto" style="width: 700px;" action="{% url 'shop:post_search' %}">
            <div class="d-flex ms-5 align-items-center">
            <input type="text" class="form-control" name="q" placeholder="Search item" />
            <button type="submit" class="btn btn-success ms-3 btn-sm">Search</button>
            </div>
        </form>
        </div>

        {% if user.is_authenticated %}
        <div class="d-flex">
        <a class="nav-link active" style="color: white" aria-current="page" href="{% url 'user:login' %}">Profile</a>
        <a class="nav-link active" style="color: white" aria-current="page" href="{% url 'user:logout' %}">Logout</a>
        </div>
        {% else %}
        <div class="d-flex">
        <a class="nav-link active" style="color: white" aria-current="page" href="{% url 'user:login' %}">Login</a>
        <a class="nav-link active" style="color: white" aria-current="page" href="{% url 'user:register' %}">Register</a>
        </div>
        {% endif %}

    </div>
    </nav>
    {% block content%}
    {% endblock content%}
</body>
</html>
