<!-- cart/cart.html -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</head>


<body>

    <h1>Your Shopping Cart</h1>
<div class="container">
    <div class="row">

        <!-- Cart Items -->
        <div class="col-md-5">
            {% for item in cart_items %}
                <div class="card mb-4 border shadow p-3">
                    <p>{{ item.product.title }} ({{ item.quantity }})</p>
                    <p>Price: ${{ item.product.discount_price }}</p>
                    <a href="{% url 'shop:remove_from_cart' item.id %}" class="btn btn-danger">
                        Remove
                    </a>
                </div>
            {% empty %}
                <p>Your cart is empty.</p>
            {% endfor %}
        </div>

        <!-- Summary Section -->
        <div class="col-md-7">

            <p>Total price: ${{ total_price }}</p>

            {% if cart_items %}
                <button type="button" class="btn btn-primary mb-3">
                    Buy Now
                </button>
            {% endif %}

            <br>

            <a class="btn btn-secondary" href="{% url 'shop:listitem' %}">
                Continue Shopping
            </a>

        </div>

    </div>
</div>
</body>

</html>
